<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
  <style>
    .bubble {
      stroke: #ff5722;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .doc-page {
      stroke: #1e1e24;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .doc-line {
      stroke: #1e1e24;
      stroke-width: 5;
      stroke-linecap: round;
      fill: none;
    }
    @media (prefers-color-scheme: dark) {
      .doc-page {
        stroke: #ffffff;
      }
      .doc-line {
        stroke: #ffffff;
      }
    }
  </style>
  <!-- Chat Bubble Contour with Bottom-Right Tail -->
  <path class="bubble" d="M64, 16 C90.5, 16 112, 35.7 112, 60 C112, 73.4 105.4, 85.4 95, 93.2 L100, 108 L83.7, 101.5 C77.6, 103.1 70.9, 104 64, 104 C37.5, 104 16, 84.3 16, 60 C16, 35.7 37.5, 16 64, 16 Z" />
  
  <!-- Document Page Contour -->
  <path class="doc-page" d="M48, 40 L72, 40 L80, 48 L80, 80 L48, 80 Z" />
  
  <!-- Document Corner Fold -->
  <path class="doc-page" d="M72, 40 L72, 48 L80, 48" />
  
  <!-- Document Content Lines -->
  <path class="doc-line" d="M56, 56 L72, 56" />
  <path class="doc-line" d="M56, 64 L72, 64" />
  <path class="doc-line" d="M56, 72 L66, 72" />
</svg>
